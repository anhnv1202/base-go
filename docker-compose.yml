version: '3'
services:
    kafka1:
        image: apache/kafka:latest
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:19092
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:29092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:19092,2@kafka2:19093,3@kafka3:19094
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
        ports:
            - "9092:9092"
            - "29092:29092"
        volumes:
            - kafka_data1:/var/lib/kafka/data

    kafka2:
        image: apache/kafka:latest
        environment:
            KAFKA_NODE_ID: 2
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:29093,CONTROLLER://0.0.0.0:19093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9093,EXTERNAL://localhost:29093
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:19092,2@kafka2:19093,3@kafka3:19094
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
        ports:
            - "9093:9093"
            - "29093:29093"
        volumes:
            - kafka_data2:/var/lib/kafka/data

    kafka3:
        image: apache/kafka:latest
        environment:
            KAFKA_NODE_ID: 3
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:29094,CONTROLLER://0.0.0.0:19094
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9094,EXTERNAL://localhost:29094
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:19092,2@kafka2:19093,3@kafka3:19094
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
        ports:
            - "9094:9094"
            - "29094:29094"
        volumes:
            - kafka_data3:/var/lib/kafka/data

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        depends_on:
            - kafka1
            - kafka2
            - kafka3
        ports:
            - "9111:8080"
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9093,kafka3:9094

volumes:
    kafka_data1:
        driver: local
    kafka_data2:
        driver: local
    kafka_data3:
        driver: local
